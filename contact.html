<body>
  <div class="wrapper">
    <div class="content">
      <main class="mainText contactPage">
        <h1 class="title">CONTACT</h1>
        <form class="contactForm" action="mailto:IKIMONO190@gmail.com" method="post" enctype="text/plain">
          <div class="formField">
            <label for="name">お名前</label>
            <input id="name" name="お名前" type="text" autocomplete="name" required>
          </div>
          <div class="formField">
            <label for="organization">会社名・団体名</label>
            <input id="organization" name="会社名・団体名" type="text" autocomplete="organization">
          </div>
          <div class="formField">
            <label for="email">メールアドレス</label>
            <input id="email" name="メールアドレス" type="email" autocomplete="email" required>
          </div>
          <div class="formField">
            <label for="category">お問い合わせ種別</label>
            <select id="category" name="お問い合わせ種別" required>
              <option value="">選択してください</option>
              <option value="制作依頼">制作依頼</option>
              <option value="作品について">作品について</option>
              <option value="取材・コラボ">取材・コラボ</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="formField">
            <label for="subject">件名</label>
            <input id="subject" name="件名" type="text" required>
          </div>
          <div class="formField">
            <label for="message">お問い合わせ内容</label>
            <textarea id="message" name="お問い合わせ内容" rows="7" required></textarea>
          </div>
          <label class="formConsent">
            <input name="送信同意" type="checkbox" value="同意しました" required>
            <span>入力内容を確認し、送信することに同意します</span>
          </label>
          <button class="submitButton" type="submit">SEND</button>
        </form>
        <p class="backLink"><a href="./">BACK</a></p>
      </main>
      <footer class="footer">
        <small class="copyright">COPYRIGHT© 生物 / IKIMONO</small>
        <div class="clock">
          <span class="date"></span> <span class="time"></span>
        </div>
      </footer>
    </div>
  </div>
  <script src="./clock.js"></script>
</body>

</html>
